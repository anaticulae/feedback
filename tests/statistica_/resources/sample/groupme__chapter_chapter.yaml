- content: "To make your project be single-source Python 2/3 compatible, the basic\
    \ steps are:\n1. Only worry about supporting Python 2.7\n2. Make sure you have\
    \ good test coverage (coverage.py can help; pip install coverage)\n3. Learn the\
    \ differences between Python 2 & 3\n4. Use Futurize (or Modernize) to update your\
    \ code (e.g. pip install future)\n5. Use Pylint to help make sure you don\u2019\
    t regress on your Python 3 support (pip install pylint)\n6. Use caniusepython3\
    \ to find out which of your dependencies are blocking your use of Python 3 (pip\n\
    install caniusepython3)\n7. Once your dependencies are no longer blocking you,\
    \ use continuous integration to make sure you stay\ncompatible with Python 2 &\
    \ 3 (tox can help test against multiple versions of Python; pip install\ntox)\n\
    8. Consider using optional static type checking to make sure your type usage works\
    \ in both Python 2 &\n3 (e.g. use mypy to check your typing under both Python\
    \ 2 & Python 3).\n"
  title: 1 The Short Explanation
- content: "A key point about supporting Python 2 & 3 simultaneously is that you can\
    \ start today! Even if your\ndependencies are not supporting Python 3 yet that\
    \ does not mean you can\u2019t modernize your code now to\nsupport Python 3. Most\
    \ changes required to support Python 3 lead to cleaner code using newer practices\n\
    even in Python 2 code.\nAnother key point is that modernizing your Python 2 code\
    \ to also support Python 3 is largely automated\nfor you. While you might have\
    \ to make some API decisions thanks to Python 3 clarifying text data versus\n\
    binary data, the lower-level work is now mostly done for you and thus can at least\
    \ benefit from the automated\nchanges immediately.\nKeep those key points in mind\
    \ while you read on about the details of porting your code to support Python\n\
    2 & 3 simultaneously.\n"
  title: 2 Details
- content: 'While you can make Python 2.5 work with Python 3, it is much easier if
    you only have to work with Python

    2.7. If dropping Python 2.5 is not an option then the six project can help you
    support Python 2.5 & 3

    simultaneously (pip install six). Do realize, though, that nearly all the projects
    listed in this HOWTO

    will not be available to you.

    If you are able to skip Python 2.5 and older, then the required changes to your
    code should continue to

    look and feel like idiomatic Python code. At worst you will have to use a function
    instead of a method

    in some instances or have to import a function instead of using a built-in one,
    but otherwise the overall

    transformation should not feel foreign to you.

    But you should aim for only supporting Python 2.7. Python 2.6 is no longer freely
    supported and thus is

    not receiving bugfixes. This means you will have to work around any issues you
    come across with Python

    2.6. There are also some tools mentioned in this HOWTO which do not support Python
    2.6 (e.g., Pylint),

    and this will become more commonplace as time goes on. It will simply be easier
    for you if you only support

    the versions of Python that you have to support.

    2

    '
  title: 2.1 Drop support for Python 2.6 and older
- content: 'In your setup.py file you should have the proper trove classifier specifying
    what versions of Python you

    support. As your project does not support Python 3 yet you should at least have
    Programming Language

    :: Python :: 2 :: Only specified. Ideally you should also specify each major/minor
    version of Python

    that you do support, e.g. Programming Language :: Python :: 2.7.

    '
  title: 2.2 Make sure you specify the proper version support in your setup.py file
- content: "Once you have your code supporting the oldest version of Python 2 you\
    \ want it to, you will want to make\nsure your test suite has good coverage. A\
    \ good rule of thumb is that if you want to be confident enough in\nyour test\
    \ suite that any failures that appear after having tools rewrite your code are\
    \ actual bugs in the tools\nand not in your code. If you want a number to aim\
    \ for, try to get over 80% coverage (and don\u2019t feel bad if\nyou find it hard\
    \ to get better than 90% coverage). If you don\u2019t already have a tool to measure\
    \ test coverage\nthen coverage.py is recommended.\n"
  title: 2.3 Have good test coverage
- content: "Once you have your code well-tested you are ready to begin porting your\
    \ code to Python 3! But to fully\nunderstand how your code is going to change\
    \ and what you want to look out for while you code, you will\nwant to learn what\
    \ changes Python 3 makes in terms of Python 2. Typically the two best ways of\
    \ doing\nthat is reading the \u201CWhat\u2019s New\u201D doc for each release\
    \ of Python 3 and the Porting to Python 3 book (which\nis free online). There\
    \ is also a handy cheat sheet from the Python-Future project.\n"
  title: 2.4 Learn the differences between Python 2 & 3
- content: "Once you feel like you know what is different in Python 3 compared to\
    \ Python 2, it\u2019s time to update your\ncode! You have a choice between two\
    \ tools in porting your code automatically: Futurize and Modernize.\nWhich tool\
    \ you choose will depend on how much like Python 3 you want your code to be. Futurize\
    \ does\nits best to make Python 3 idioms and practices exist in Python 2, e.g.\
    \ backporting the bytes type from\nPython 3 so that you have semantic parity between\
    \ the major versions of Python. Modernize, on the other\nhand, is more conservative\
    \ and targets a Python 2/3 subset of Python, directly relying on six to help provide\n\
    compatibility. As Python 3 is the future, it might be best to consider Futurize\
    \ to begin adjusting to any\nnew practices that Python 3 introduces which you\
    \ are not accustomed to yet.\nRegardless of which tool you choose, they will update\
    \ your code to run under Python 3 while staying\ncompatible with the version of\
    \ Python 2 you started with. Depending on how conservative you want to\nbe, you\
    \ may want to run the tool over your test suite first and visually inspect the\
    \ diff to make sure the\ntransformation is accurate. After you have transformed\
    \ your test suite and verified that all the tests still pass\nas expected, then\
    \ you can transform your application code knowing that any tests which fail is\
    \ a translation\nfailure.\nUnfortunately the tools can\u2019t automate everything\
    \ to make your code work under Python 3 and so there are\na handful of things\
    \ you will need to update manually to get full Python 3 support (which of these\
    \ steps are\nnecessary vary between the tools). Read the documentation for the\
    \ tool you choose to use to see what it fixes\nby default and what it can do optionally\
    \ to know what will (not) be fixed for you and what you may have\nto fix on your\
    \ own (e.g. using io.open() over the built-in open() function is off by default\
    \ in Modernize).\nLuckily, though, there are only a couple of things to watch\
    \ out for which can be considered large issues that\nmay be hard to debug if not\
    \ watched for.\n3\nDivision\nIn Python 3, 5 / 2 == 2.5 and not 2; all division\
    \ between int values result in a float. This change has\nactually been planned\
    \ since Python 2.2 which was released in 2002. Since then users have been encouraged\n\
    to add from __future__ import division to any and all files which use the / and\
    \ // operators or to be\nrunning the interpreter with the -Q flag. If you have\
    \ not been doing this then you will need to go through\nyour code and do two things:\n\
    1. Add from __future__ import division to your files\n2. Update any division operator\
    \ as necessary to either use // to use floor division or continue using / and\n\
    expect a float\nThe reason that / isn\u2019t simply translated to // automatically\
    \ is that if an object defines a __truediv__\nmethod but not __floordiv__ then\
    \ your code would begin to fail (e.g. a user-defined class that uses / to\nsignify\
    \ some operation but not // for the same thing or at all).\nText versus binary\
    \ data\nIn Python 2 you could use the str type for both text and binary data.\
    \ Unfortunately this confluence of\ntwo different concepts could lead to brittle\
    \ code which sometimes worked for either kind of data, sometimes\nnot. It also\
    \ could lead to confusing APIs if people didn\u2019t explicitly state that something\
    \ that accepted str\naccepted either text or binary data instead of one specific\
    \ type. This complicated the situation especially\nfor anyone supporting multiple\
    \ languages as APIs wouldn\u2019t bother explicitly supporting unicode when they\n\
    claimed text data support.\nTo make the distinction between text and binary data\
    \ clearer and more pronounced, Python 3 did what\nmost languages created in the\
    \ age of the internet have done and made text and binary data distinct types\n\
    that cannot blindly be mixed together (Python predates widespread access to the\
    \ internet). For any code\nthat deals only with text or only binary data, this\
    \ separation doesn\u2019t pose an issue. But for code that has\nto deal with both,\
    \ it does mean you might have to now care about when you are using text compared\
    \ to\nbinary data, which is why this cannot be entirely automated.\nTo start,\
    \ you will need to decide which APIs take text and which take binary (it is highly\
    \ recommended you\ndon\u2019t design APIs that can take both due to the difficulty\
    \ of keeping the code working; as stated earlier it\nis difficult to do well).\
    \ In Python 2 this means making sure the APIs that take text can work with unicode\n\
    and those that work with binary data work with the bytes type from Python 3 (which\
    \ is a subset of str\nin Python 2 and acts as an alias for bytes type in Python\
    \ 2). Usually the biggest issue is realizing which\nmethods exist on which types\
    \ in Python 2 & 3 simultaneously (for text that\u2019s unicode in Python 2 and\
    \ str\nin Python 3, for binary that\u2019s str/bytes in Python 2 and bytes in\
    \ Python 3). The following table lists\nthe unique methods of each data type across\
    \ Python 2 & 3 (e.g., the decode() method is usable on the\nequivalent binary\
    \ data type in either Python 2 or 3, but it can\u2019t be used by the textual\
    \ data type consistently\nbetween Python 2 and 3 because str in Python 3 doesn\u2019\
    t have the method). Do note that as of Python 3.5\nthe __mod__ method was added\
    \ to the bytes type.\nText data Binary data\ndecode\nencode\nformat\nisdecimal\n\
    isnumeric\nMaking the distinction easier to handle can be accomplished by encoding\
    \ and decoding between binary\ndata and text at the edge of your code. This means\
    \ that when you receive text in binary data, you should\nimmediately decode it.\
    \ And if your code needs to send text as binary data then encode it as late as\
    \ possible.\n4\nThis allows your code to work with only text internally and thus\
    \ eliminates having to keep track of what\ntype of data you are working with.\n\
    The next issue is making sure you know whether the string literals in your code\
    \ represent text or binary\ndata. You should add a b prefix to any literal that\
    \ presents binary data. For text you should add a u prefix\nto the text literal.\
    \ (there is a __future__ import to force all unspecified literals to be Unicode,\
    \ but usage\nhas shown it isn\u2019t as effective as adding a b or u prefix to\
    \ all literals explicitly)\nAs part of this dichotomy you also need to be careful\
    \ about opening files. Unless you have been working\non Windows, there is a chance\
    \ you have not always bothered to add the b mode when opening a binary file\n\
    (e.g., rb for binary reading). Under Python 3, binary files and text files are\
    \ clearly distinct and mutually\nincompatible; see the io module for details.\
    \ Therefore, you must make a decision of whether a file will be\nused for binary\
    \ access (allowing binary data to be read and/or written) or textual access (allowing\
    \ text data\nto be read and/or written). You should also use io.open() for opening\
    \ files instead of the built-in open()\nfunction as the io module is consistent\
    \ from Python 2 to 3 while the built-in open() function is not (in\nPython 3 it\u2019\
    s actually io.open()). Do not bother with the outdated practice of using codecs.open()\
    \ as\nthat\u2019s only necessary for keeping compatibility with Python 2.5.\n\
    The constructors of both str and bytes have different semantics for the same arguments\
    \ between Python 2\n& 3. Passing an integer to bytes in Python 2 will give you\
    \ the string representation of the integer: bytes(3)\n== '3'. But in Python 3,\
    \ an integer argument to bytes will give you a bytes object as long as the integer\n\
    specified, filled with null bytes: bytes(3) == b'\\x00\\x00\\x00'. A similar worry\
    \ is necessary when passing\na bytes object to str. In Python 2 you just get the\
    \ bytes object back: str(b'3') == b'3'. But in Python\n3 you get the string representation\
    \ of the bytes object: str(b'3') == \"b'3'\".\nFinally, the indexing of binary\
    \ data requires careful handling (slicing does not require any special handling).\n\
    In Python 2, b'123'[1] == b'2' while in Python 3 b'123'[1] == 50. Because binary\
    \ data is simply a\ncollection of binary numbers, Python 3 returns the integer\
    \ value for the byte you index on. But in Python\n2 because bytes == str, indexing\
    \ returns a one-item slice of bytes. The six project has a function named\nsix.indexbytes()\
    \ which will return an integer like in Python 3: six.indexbytes(b'123', 1).\n\
    To summarize:\n1. Decide which of your APIs take text and which take binary data\n\
    2. Make sure that your code that works with text also works with unicode and code\
    \ for binary data\nworks with bytes in Python 2 (see the table above for what\
    \ methods you cannot use for each type)\n3. Mark all binary literals with a b\
    \ prefix, textual literals with a u prefix\n4. Decode binary data to text as soon\
    \ as possible, encode text as binary data as late as possible\n5. Open files using\
    \ io.open() and make sure to specify the b mode when appropriate\n6. Be careful\
    \ when indexing into binary data\nUse feature detection instead of version detection\n\
    Inevitably you will have code that has to choose what to do based on what version\
    \ of Python is running.\nThe best way to do this is with feature detection of\
    \ whether the version of Python you\u2019re running under\nsupports what you need.\
    \ If for some reason that doesn\u2019t work then you should make the version check\
    \ be\nagainst Python 2 and not Python 3. To help explain this, let\u2019s look\
    \ at an example.\nLet\u2019s pretend that you need access to a feature of importlib\
    \ that is available in Python\u2019s standard library\nsince Python 3.3 and available\
    \ for Python 2 through importlib2 on PyPI. You might be tempted to write\ncode\
    \ to access e.g. the importlib.abc module by doing the following:\n5\nimport sys\n\
    if sys.version_info[0] == 3:\nfrom importlib import abc\nelse:\nfrom importlib2\
    \ import abc\nThe problem with this code is what happens when Python 4 comes out?\
    \ It would be better to treat Python 2\nas the exceptional case instead of Python\
    \ 3 and assume that future Python versions will be more compatible\nwith Python\
    \ 3 than Python 2:\nimport sys\nif sys.version_info[0] > 2:\nfrom importlib import\
    \ abc\nelse:\nfrom importlib2 import abc\nThe best solution, though, is to do\
    \ no version detection at all and instead rely on feature detection. That\navoids\
    \ any potential issues of getting the version detection wrong and helps keep you\
    \ future-compatible:\ntry:\nfrom importlib import abc\nexcept ImportError:\nfrom\
    \ importlib2 import abc\n"
  title: 2.5 Update your code
- content: "Once you have fully translated your code to be compatible with Python\
    \ 3, you will want to make sure your\ncode doesn\u2019t regress and stop working\
    \ under Python 3. This is especially true if you have a dependency\nwhich is blocking\
    \ you from actually running under Python 3 at the moment.\nTo help with staying\
    \ compatible, any new modules you create should have at least the following block\
    \ of\ncode at the top of it:\nfrom __future__ import absolute_import\nfrom __future__\
    \ import division\nfrom __future__ import print_function\nYou can also run Python\
    \ 2 with the -3 flag to be warned about various compatibility issues your code\n\
    triggers during execution. If you turn warnings into errors with -Werror then\
    \ you can make sure that you\ndon\u2019t accidentally miss a warning.\nYou can\
    \ also use the Pylint project and its --py3k flag to lint your code to receive\
    \ warnings when your\ncode begins to deviate from Python 3 compatibility. This\
    \ also prevents you from having to run Modernize\nor Futurize over your code regularly\
    \ to catch compatibility regressions. This does require you only support\nPython\
    \ 2.7 and Python 3.4 or newer as that is Pylint\u2019s minimum Python version\
    \ support.\n"
  title: 2.6 Prevent compatibility regressions
- content: "After you have made your code compatible with Python 3 you should begin\
    \ to care about whether your\ndependencies have also been ported. The caniusepython3\
    \ project was created to help you determine which\n6\nprojects \u2013 directly\
    \ or indirectly \u2013 are blocking you from supporting Python 3. There is both\
    \ a command-line\ntool as well as a web interface at https://caniusepython3.com.\n\
    The project also provides code which you can integrate into your test suite so\
    \ that you will have a failing test\nwhen you no longer have dependencies blocking\
    \ you from using Python 3. This allows you to avoid having\nto manually check\
    \ your dependencies and to be notified quickly when you can start running on Python\
    \ 3.\n"
  title: 2.7 Check which dependencies block your transition
- content: 'Once your code works under Python 3, you should update the classifiers
    in your setup.py to contain

    Programming Language :: Python :: 3 and to not specify sole Python 2 support.
    This will tell anyone

    using your code that you support Python 2 and 3. Ideally you will also want to
    add classifiers for each

    major/minor version of Python you now support.

    '
  title: 2.8 Update your setup.py file to denote Python 3 compatibility
- content: "Once you are able to fully run under Python 3 you will want to make sure\
    \ your code always works under\nboth Python 2 & 3. Probably the best tool for\
    \ running your tests under multiple Python interpreters is tox.\nYou can then\
    \ integrate tox with your continuous integration system so that you never accidentally\
    \ break\nPython 2 or 3 support.\nYou may also want to use the -bb flag with the\
    \ Python 3 interpreter to trigger an exception when you are\ncomparing bytes to\
    \ strings or bytes to an int (the latter is available starting in Python 3.5).\
    \ By default\ntype-differing comparisons simply return False, but if you made\
    \ a mistake in your separation of text/binary\ndata handling or indexing on bytes\
    \ you wouldn\u2019t easily find the mistake. This flag will raise an exception\n\
    when these kinds of comparisons occur, making the mistake much easier to track\
    \ down.\nAnd that\u2019s mostly it! At this point your code base is compatible\
    \ with both Python 2 and 3 simultaneously.\nYour testing will also be set up so\
    \ that you don\u2019t accidentally break Python 2 or 3 compatibility regardless\n\
    of which version you typically run your tests under while developing.\n"
  title: 2.9 Use continuous integration to stay compatible
- content: "Another way to help port your code is to use a static type checker like\
    \ mypy or pytype on your code. These\ntools can be used to analyze your code as\
    \ if it\u2019s being run under Python 2, then you can run the tool a\nsecond time\
    \ as if your code is running under Python 3. By running a static type checker\
    \ twice like this you\ncan discover if you\u2019re e.g. misusing binary data type\
    \ in one version of Python compared to another. If you\nadd optional type hints\
    \ to your code you can also explicitly state whether your APIs use textual or\
    \ binary\ndata, helping to make sure everything functions as expected in both\
    \ versions of Python.\n7\n"
  title: 2.10 Consider using optional static type checking
