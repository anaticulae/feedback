[build-system]
requires = [
    "setuptools>=83.0.0",
    "wheel>=0.47.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "feedback"
version = "1.15.5"
description = ""
requires-python = ">=3.12"
authors = [
    { name = "Helmut Konrad Schewe", email = "helmutus@outlook.com" },
]
dependencies = [
    "iamraw>=4.95.1,<5.0.0",
    "protoerror>=3.20.4,<4.0.0",
    "utilo>=2.112.1,<3.0.0",
    "configos>=1.0.4,<2.0.0",
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = [
    "LICENSE",
]

[project.readme]
file = "README"
content-type = "text/markdown"

[project.optional-dependencies]
dev = [
    "decider-chapter>=1.0.2,<2.0.0",
    "decider-con>=1.0.1,<2.0.0",
    "decider-lay>=1.0.0,<2.0.0",
    "decider-main>=3.4.3,<4.0.0",
    "gennex==1.1.0",
    "genref==1.4.4",
    "hoverpower==1.7.0",
    "utilotest==1.1.1",
]

[project.urls]
Homepage = "https://github.com/anaticulae/feedback"
Repository = "https://github.com/anaticulae/feedback"

[project.scripts]
feedback = "feedback.cli:main"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]

[tool.semantic_release.changelog]
mode = "init"
output_format = "md"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG"

[tool.semantic_release.commit_parser_options]
patch_tags = [
    "build",
    "chore",
    "ci",
    "deps",
    "docs",
    "fix",
    "perf",
    "refactor",
    "style",
    "test",
]
minor_tags = [
    "feat",
]

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "feedback",
    "feedback.features",
    "feedback.problems",
    "feedback.renderer",
    "feedback.utils",
]
exclude = [
    "tests*",
]

[tool.hoverpower]
packages = [
    "BACHELOR",
    "BOOK",
    "DISS",
    "DOCU",
    "HOME",
    "MASTER",
    "TECH",
]
