<h2>Schlechte Schriftarten</h2>

<table>
    <thead>
        <tr>
            <td width=250>Schriftart</td>
            <td>Beschreibung</td>
            <td>Hinweise</td>
        </tr>
    </thead>
    <tbody>
        {% for name, scale, description, links in fonts %}
        <tr>
            <td>{{name}} {{scale}}</td>
            <td>{{description}}</td>
            <td>
                {% for text, href  in links %}
                <a href="{{href}}" target="_blank">{{text}}</a><br />
                {% endfor %}
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
