{% if words %}
<h2>Worthäufigkeit</h2>
<table>
    <thead>
        <tr>
            <td width=250>Wort</td>
            <td>Anzahl</td>
        </tr>
    </thead>
    <tbody>
        {% for word, occurence in words %}
        <tr>
            <td>{{word}}</td>
            <td>{{occurence}}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endif %}
